name: Telegram Music Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

# не запускать два бота одновременно: новый запуск заменяет старый
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # yt-dlp для YouTube теперь нужен JS-рантайм
    - name: Set up Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install --upgrade "yt-dlp[default]"

    - name: Write YouTube cookies (optional)
      env:
        YT_COOKIES: ${{ secrets.YT_COOKIES }}
      run: |
        if [ -n "$YT_COOKIES" ]; then
          printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          echo "COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
        fi

    - name: Run Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: python bot.py
